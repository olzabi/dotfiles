setupVersion: 2
autoUpdate: false
quietStartup: header
defaultProvider: openai-codex
defaultModel: gpt-6-luna
defaultThinkingLevel: high
modelRoles:
  default: openai-codex/gpt-6-luna
  smol: openai-codex/gpt-6-luna
  commit: openai-codex/gpt-6-luna:low
  image: openai-codex/gpt-image-2
markdown:
  mermaid: streaming
enableSkillCommands: true
editorPaddingX: 1
outputPad: 1
terminal:
  clearOnShrink: false
  showProgress: true
  programStatus: true
steeringMode: all
followUpMode: all
transport: auto
httpIdleTimeoutMs: 120000
showCacheMissNotices: true
showWorkerNotifications: true
treeFilterMode: default
fullscreenExitOutput: transcript
enableInstallTelemetry: false
startup:
  changelogMode: summary
memory:
  backend: mnemopi
autolearn:
  enabled: true
personality: pragmatic
proseOnlyThinking: false
hideThinkingBlock: true
readLineNumbers: true
symbolPreset: nerd
theme:
  dark: darkvoid
composer:
  shape: box
  tokenRate: true
statusLine:
  preset: custom
  separator: powerline-thin
  contextLine: embedded
  sessionAccent: false
  transparent: false
  compactThinkingLevel: true
  showHookStatus: true
display:
  showTurnTime: false
  showTokenUsage: false
  cacheMissMarker: true
  collapseCompacted: true
  hideToolActivity: false
  smoothStreaming: true
  subagentLivePreview: true
  pinnedAgents: collapsed
  shimmer: classic
edit:
  mode: hashline
tuiMode: regular
tui:
  vimMode: true
  textSizing: true
  autoGraph: smart
  titleSpinner: braille
  tight: false
  imeSafeCursor: true
title:
  icons: nf+emoji
task:
  showResolvedModelBadge: false
showHardwareCursor: true
colorBlindMode: false
omitThinking: false
externalThinking: false
codexResets:
  autoRedeem: "no"