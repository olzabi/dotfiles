setupVersion: 2
autoUpdate: false
quietStartup: header
defaultProvider: openai-codex
defaultModel: gpt-6-luna
modelRoles:
  default: openai-codex/gpt-6-luna:high
  smol: openai-codex/gpt-6-luna
  advisor: openai-codex/gpt-6.1-terra:medium
  commit: openai-codex/gpt-6-luna:low
  image: openai-codex/gpt-image-2
  plan: openai-codex/gpt-6.1-terra:xhigh
  tiny: openai-codex/gpt-6-luna:low
  web: web/searxng
searxng:
  endpoint: http://127.0.0.1:8888
markdown:
  mermaid: streaming
editorPaddingX: 1
outputPad: 1
terminal:
  clearOnShrink: false
  showProgress: true
steeringMode: all
followUpMode: all
interruptMode: immediate
transport: auto
httpIdleTimeoutMs: 120000
showCacheMissNotices: true
showWorkerNotifications: true
fullscreenExitOutput: transcript
enableInstallTelemetry: false
memory:
  backend: mnemopi
  scoping: per-project-tagged
  llmMode: smol
compaction:
  enabled: true
  midTurnEnabled: true
  asyncEnabled: true
  idleEnabled: true
  idleTimeoutSeconds: 60
  idleThresholdTokens: 200000
  thresholdPercent: 85
  methodOrder:
    - shake
    - snapcompact
    - remote
    - handoff
    - soft
  handoffSaveToDisk: true
  supersedeReads: true
  dropUseless: true
branchSummary:
  enabled: true
autolearn:
  enabled: true
personality: pragmatic
proseOnlyThinking: false
hideThinkingBlock: true
readLineNumbers: true
read:
  defaultLimit: 300
  renderMarkdown: false
  summarize:
    enabled: true
  toolResultPreview: false
edit:
  mode: hashline
  fuzzyMatch: true
  blockAutoGenerated: true
  autoRepair:
    enabled: true
  streamingAbort: false
bash:
  enabled: true
  autoBackground:
    enabled: true
    thresholdMs: 5000
  direnv: auto
eval:
  py: true
  js: false
  autoBackground:
    enabled: true
    thresholdMs: 5000
python:
  kernelMode: session

symbolPreset: nerd
theme:
  dark: darkvoid
composer:
  shape: box
  tokenRate: true
statusLine:
  preset: custom
  sessionAccent: false
display:
  cacheMissMarker: true
  subagentLivePreview: true
tuiMode: regular
tui:
  vimMode: true
  textSizing: true
  autoGraph: smart
  imeSafeCursor: true
codexResets:
  autoRedeem: "no"
github:
  enabled: true
disabledExtensions: []
input:
  bareSlashCommands: true
