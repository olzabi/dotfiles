autolearn:
  enabled: true
  autoContinue: true
theme:
  dark: darkvoid.omp
  light: darkvoid.omp
defaultProvider: openai-codex
defaultModel: gpt-5.5
defaultThinkingLevel: auto
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  plan: openai-codex/gpt-5.6-sol
  advisor: openai-codex/gpt-5.6-sol
providers:
  openai-codex:
    codeMode: auto
symbolPreset: nerd
setupVersion: 2
statusLine:
  preset: compact
  separator: powerline-thin
  sessionAccent: true
  transparent: true
  compactThinkingLevel: true
  showHookStatus: true
terminal:
  showProgress: true
tui:
  textSizing: true
  renderMermaid: true
  tight: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  smoothStreaming: true
  hideToolActivity: false
  collapseCompacted: true
colorBlindMode: false
formatOnWrite: true
todo:
  enabled: true
github:
  enabled: true
dev:
  autoqaConsent: granted
composer:
  shape: field
hideThinkingBlock: false
omitThinking: true
prewalk:
  enabled: true
advisor:
  enabled: true
  syncBacklog: "1"
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
personality: pragmatic
plan:
  enabled: true

