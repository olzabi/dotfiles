# managed by `headroom wrap omp` — do not hand-edit while wrapped.
# `headroom unwrap omp` restores the pre-wrap file (or removes this one
# if it did not exist). The original is kept at <models.yml.headroom-backup>.
providers:
  ollama:
    baseUrl: http://127.0.0.1:11434/v1
    api: openai-completions
    apiKey: ollama
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: true
    models:
    - id: qwen3.5:latest
      name: Qwen 3.5
      reasoning: false
      input:
      - text
      - image
      contextWindow: 262144
      maxTokens: 8192
      samplingParams:
        reasoning_effort: none
      cost:
        input: 0
        output: 0
        cacheRead: 0
        cacheWrite: 0
  anthropic:
    baseUrl: http://127.0.0.1:8787
