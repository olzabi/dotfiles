# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
---
git:
  paging:
    colorArg: always
    # pager: delta --features=colibri --paging=never
    pager: delta --features=collared-trogon --paging=never
  autoFetch: true
  autoRefresh: false
  disableForcePushing: true
  commit:
    autoWrapCommitMessage: true
    autoWrapWidth: 90
gui:
  language: en
  border: single
  nerdFontsVersion: "3"
  showRandomTip: false
  showCommandLog: false
  expandFocusedSidePanel: true
  sidePanelWidth: 0.20
  commitLength:
    show: true
  showListFooter: true
  tabWidth: 2
  showIcons: true
  filterMode: fuzzy
  splitDiff: auto
  portraitMode: never
  theme:
    activeBorderColor:
      - magenta
      - bold
    inactiveBorderColor:
      - white
    searchingActiveBorderColor:
      - cyan
      - bold
    optionsTextColor:
      - white
    selectedLineBgColor:
      - "#453461"
    cherryPickedCommitBgColor:
      - cyan
    cherryPickedCommitFgColor:
      - blue
    markedBaseCommitBgColor:
      - yellow
    markedBaseCommitFgColor:
      - blue
    unstagedChangesColor:
      - white
    defaultFgColor:
      - default
