services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./storage/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db_psql
    profiles: [postgres, sql, all]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DB:-devdb}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./storage/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db_mysql
    profiles: [mysql, sql, all]
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: searxng
    restart: unless-stopped
    env_file:
      - ${SEARXNG_ENV_FILE:-./searxng/.env}
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:${SEARXNG_PORT:-8888}/
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    dns:
      - 1.1.1.1
      - 9.9.9.9
    volumes:
      - ./searxng/config:/etc/searxng:ro,Z
      - searxng_cache:/var/cache/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: [searxng, llm, all]
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    ports:
      - 9999:8080
    restart: unless-stopped
  grafana:
    image: docker.io/grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # used by provisioning files
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_DB: ${MYSQL_DB:-devdb}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./storage/grafana/provisioning:/etc/grafana/provisioning:Z
    networks:
      - db_psql
      - db_mysql
volumes:
  dozzle_data:
  grafana-data:
  postgres_data:
  mysql_data:
  searxng_cache:
networks:
  db_psql:
    external: true
  db_mysql:
    external: true
