# Sunshine makes its sink the default, then records it, so WirePlumber
# (linking.follow-default-target) moves the recorder along with later default
# changes: picking headphones would send their audio to Moonlight too.
stream.rules = [
    {
        matches = [
            { application.process.binary = "sunshine" media.name = "sunshine-record" }
        ]
        actions = { update-props = { node.dont-reconnect = true } }
    }
]
