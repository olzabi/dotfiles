# Every card here (QuadCast S, Generic USB Audio, both HDMI) does 44.1 and 48 kHz,
# so 44.1 kHz music plays without resampling; the graph switches when it is idle.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 ]
}

# Better resampler for the streams that still need it (default 4; costs a little CPU).
stream.properties = {
    resample.quality = 10
}
