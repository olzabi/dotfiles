# Keep the QuadCast S headphone output and mic open: a suspended USB device clips the
# first moments of a sound (notifications, Discord) and can pop when it wakes.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_(output|input).usb-HP__Inc_HyperX_QuadCast_S.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
