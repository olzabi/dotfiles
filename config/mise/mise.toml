[env]
HK_MISE = 1
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[settings]
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "php"]
fetch_remote_versions_timeout = "30s"
http_timeout = "30s"
auto_update = true
verbose = false
raw = false
jobs = 4
minimum_release_age = "3d" # skip releases younger than 3 days: most hijacked releases are pulled within that window
pipx.uvx = true

[settings.skills]
# dir comes from MISE_SKILLS_DIR in config/zsh/.zshenv: a relative path here resolves against cwd
auto_sync = true
prune = true

[settings.python]
uv_venv_auto = true
uv_venv_create_args = ["--seed"]


[tools]
"github:nnnkkk7/lazyactions" = "latest"
