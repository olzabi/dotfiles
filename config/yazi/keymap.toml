# "$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]
prepend_keymap = [
    { on = [ "m" ],      run = "plugin whoosh save",          desc = "Bookmark the hovered path" },
    { on = [ "'" ],      run = "plugin whoosh jump_by_key",   desc = "Jump to a bookmark (menu: Tab history, - repo root)" },
    { on = [ "b", "/" ], run = 'shell --block -- p=$(tv yazi-bookmarks) && [ -e "$p" ] && { [ -d "$p" ] && ya emit cd "$p" || ya emit reveal "$p"; }', desc = "Find a bookmark (tv)" },
    { on = [ "b", "r" ], run = "plugin whoosh rename_by_key", desc = "Rename a bookmark" },
    { on = [ "b", "d" ], run = "plugin whoosh delete_by_key", desc = "Delete a bookmark" },
    { on = [ "b", "D" ], run = "plugin whoosh delete_all",    desc = "Delete all bookmarks" },

    # Plugin
    { on = ['c', 'm'], run = "plugin chmod",                      desc = "Chmod on selected files" },
    { on = ["g", "l"], run = "plugin lazygit",                    desc = "Run Lazygit" },
    { on = ["M", "s"], run = "plugin sshfs -- menu",              desc = "SSHFS: mount, unmount or ssh into a host" },
    { on = ["d", "u"], run = "plugin restore",                    desc = "Restore last deleted files/folders" },
    { on = ["d", "U"], run = "plugin restore -- --interactive",   desc = "Restore deleted files/folders (Interactive)" },
    { on = "l",        run = "plugin smart-enter",         desc = "Enter the child directory, or open the file" },
    { on = "L",        run = 'shell --block -- hunk diff -- %h',  desc = "Review git diff in Hunk" },
    { on = "<S-Enter>", run = 'shell -- case %h in *.md|*.markdown) ob %h ;; *) ya emit open --interactive ;; esac', desc = "Markdown: open in Obsidian; others: choose how to open" },

    { on = ["<Space>", "j"],        run = [ "toggle", "arrow next" ],  desc = "Toggle the current selection state" },
    { on = ["<Space>", "<Space>"],  run = "plugin motions",            desc = "Start a counted motion (5j, 3yy, 2gt)" },
    { on = "f",                     run = "plugin jump-to-char",       desc = "Jump to char" },
    { on = "F",                     run = "plugin smart-filter",       desc = "Smart filter" },

    # Goto
    { on = ["g", "h"], run = "cd ~",                                                              desc = "Go to the Home directory" },
    { on = ["g", "d"], run = "cd $DOTFILES",                                                      desc = "Go to the Dotfiles" },
    { on = ["g", "p"], run = "cd ~/Projects",                                                    desc = "Go to the Projects" },
    { on = ["g", "<Space>"], run = "cd --interactive",                                            desc = "Go to a directory interactively" },
    { on = ["g", "r"], run  = 'shell --orphan -- ya emit cd "$(git rev-parse --show-toplevel)"',  desc = "Go to the repository root" },
    { on = ["g", "w"], run  = 'shell --block -- p=$(wt switch --no-cd --format json | jq -r .path) && [ -n "$p" ] && ya emit cd "$p"', desc = "Go to a worktree (wt picker, with diff preview)" },
    { on = ["g", "s"], run  = 'shell --orphan -- herdr-app do space.new --folder "$PWD"',        desc = "Open this folder as a herdr space" },

    # Pickers and tools (tv = television; channels from `tv update-channels`)
    { on = "<C-p>",      run = 'shell --block -- p=$(tv files) && [ -n "$p" ] && ya emit reveal "$p"', desc = "Find a file (tv) and reveal it" },
    { on = ["g", "/"],   run = 'shell --block -- p=$(tv dirs) && [ -n "$p" ] && ya emit cd "$p"',     desc = "Find a directory (tv) and cd" },
    { on = "<C-s>",      run = 'shell --block -- tv text',                                            desc = "Grep (tv + rg), open the hit in $EDITOR" },
    { on = ["g", "b"],   run = 'shell --block -- tv git-branch',                                      desc = "Git branches (tv)" },
    { on = ["c", "s"],   run = 'shell -- herdr-paths %s',                                             desc = "Send selected paths to the last focused agent (herdr)" },
    { on = "!",          run = 'shell "$SHELL" --block',                                              desc = "Open $SHELL here" },

    { on = [ "J" ], run = "seek 2",  desc = "Seek down 2 lines in preview" },
    { on = [ "K" ], run = "seek -2", desc = "Seek up 2 lines in preview" },

    { on = "<F3>", run = "plugin mediainfo -- toggle-metadata", desc = "Toggle media preview metadata" },
    { on = "<F4>", run = "plugin mediainfo -- toggle-preview",  desc = "Toggle media preview image" },

]

