onboarding = false

[theme]
[theme.custom]
accent      = "#1bfd9c"  # mint — primary highlight/active borders (your "operator/accent mint")
panel_bg    = "#1c1c1c"  # bg
surface0    = "#3c3c3c"  # eob — selected/focused item background
surface1    = "#404040"  # line_nr — hover/active background (lightest surface tier)
surface_dim = "#303030"  # visual — dim separators
overlay0    = "#585858"  # comment — muted secondary text
overlay1    = "#a1a1a1"  # type — slightly brighter overlay text
text        = "#c0c0c0"  # fg — main text
subtext0    = "#b1b1b1"  # identifier — subdued text
mauve       = "#bdfe58"  # title/cursor lime — branch name / special label color
green       = "#1bfd9c"  # operator/mint — done/idle agent state
yellow      = "#ffffba"  # changed/warning — working/running agent state
red         = "#dea6a0"  # error — blocked/needs-attention agent state
blue        = "#7fa1c3"  # info — unseen/done notification accent
teal        = "#66b2b2"  # bool — notification accent / unseen markers
peach       = "#bedc74"  # hint — interrupted/warning state

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"

[keys]
prefix = "ctrl+s"
reload_config            = "prefix+shift+r"
split_vertical           = "prefix+|"
split_horizontal         = "prefix+minus"
detach                   = "prefix+d"
open_notification_target = "prefix+o"

# navigate_pane_left  = "h"      # left arrow always focuses the pane to the left
# navigate_pane_up    = "k"
# navigate_pane_down  = "j"
# navigate_pane_right = "l"     # right arrow always focuses the pane to the right
focus_pane_left     = "prefix+h"
focus_pane_down     = "prefix+j"
focus_pane_up       = "prefix+k"
focus_pane_right    = "prefix+l"

new_tab      = "prefix+n"
switch_tab   = "prefix+1..9"
previous_tab = "prefix+p"
next_tab     = "prefix+c"
rename_tab   = "prefix+,"


workspace_picker         = "prefix+;"
navigate_workspace_up    = "k"
navigate_workspace_down  = "j"
rename_workspace         = "prefix+$"

[worktrees]
directory = "~/.config/herdr/worktrees"

[ui]
mouse_capture = true
redraw_on_focus_gained = true
confirm_close = true
prompt_new_tab_name = true
show_agent_labels_on_pane_borders = true
agent_panel_scope = "all"
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true

# Background notification popup delivery
# off | herdr | terminal | system
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]

# Play sounds when agents change state in background workspaces
[ui.sound]
[ui.sound.agents]
droid = "on"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = true

[advanced]
# scrollback_limit_bytes = 10000000
