git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --features=darkvoid
  autoFetch: true
  autoRefresh: false
  disableForcePushing: true
  commit:
    autoWrapCommitMessage: true
    autoWrapWidth: 90
gui:
  language: en
  border: single
  nerdFontsVersion: "3"
  showRandomTip: false
  showCommandLog: false
  expandFocusedSidePanel: true
  sidePanelWidth: 0.20
  commitLength:
    show: true
  showListFooter: true
  tabWidth: 2
  showIcons: true
  filterMode: fuzzy
  splitDiff: auto
  portraitMode: never
  skipStashWarning: true
  theme:
    # Active panel border — neon green accent (operator/search color)
    activeBorderColor:
      - '#1bfd9c'
      - bold
    # Inactive panel borders — dim grey
    inactiveBorderColor:
      - '#404040'
    # Border color when searching/filtering
    searchingActiveBorderColor:
      - '#bdfe58'
      - bold
    # Selected line background — subtle highlight row
    selectedLineBgColor:
      - '#303030'
    # Bottom bar options text
    optionsTextColor:
      - '#585858'
    # Default text color
    defaultFgColor:
      - '#c0c0c0'
    # Unstaged changes — soft red
    unstagedChangesColor:
      - '#ffb3ba'
    # Cherry-picked commit highlight
    cherryPickedCommitBgColor:
      - '#303030'
    cherryPickedCommitFgColor:
      - '#1bfd9c'
