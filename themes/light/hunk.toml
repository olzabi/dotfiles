transparent_background = true
line_numbers = true
agent_notes = true
menu_bar = true
exclude_untracked = false
copy_decorations = false
hunk_headers = false
wrap_lines = false

cursor_line = "row"
theme = "custom"
mode = "auto"
vcs = "git"

[pager]
theme = "custom"

[custom_theme]
base = "github-light-default"
label = "Darkvoid"

background = "#d3ceca"
panel = "#d3ceca"
panelAlt = "#d3ceca"
border = "#a09b97" # herdr-app border
accent = "#00695d" # herdr-app accent, so hunk in a herdr popup or lazygit matches
accentMuted = "#006a6c"
text = "#3a3633"
muted = "#5c5954" # herdr-app muted

addedBg = "#d3ceca"
removedBg = "#dcbac3"
movedAddedBg = "#c8c3bf"
movedRemovedBg = "#bab6b1"
contextBg = "#d3ceca"
addedContentBg = "#acc1aa"
removedContentBg = "#dbb8bd"
contextContentBg = "#d3ceca"
addedSignColor = "#00581b"
removedSignColor = "#913948"

lineNumberBg = "#d3ceca"
lineNumberFg = "#a09b97"
selectedHunk = "#bab6b1"
badgeAdded = "#00581b"
badgeRemoved = "#9e3c4a"
badgeNeutral = "#5c5954"
fileNew = "#00581b"
fileDeleted = "#9e3c4a"
fileRenamed = "#4e4900"
fileModified = "#4e4900"
fileUntracked = "#77736f"
noteBorder = "#00695d"
noteBackground = "#d3ceca"
noteTitleBackground = "#bab6b1"
noteTitleText = "#006a6c"


