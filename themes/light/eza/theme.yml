colourful: true
# yellow #4b4d00
# red    #a64542
# purple #714da0
# pink   #964072
# orange #874500
# green  #005e1d
# cyan   #005871
# others:
# dark-blue    #5467ac
# foreground   #110e0b
# current_line #acafc6

filekinds:
  normal: {foreground: "#110e0b"}
  directory: {foreground: "#005871"}
  symlink: {foreground: "#714da0"}
  pipe: {foreground: "#5467ac"}
  block_device: {foreground: "#a64542"}
  char_device: {foreground: "#a64542"}
  socket: {foreground: "#acafc6"}
  special: {foreground: "#964072"}
  executable: {foreground: "#005e1d"}
  mount_point: {foreground: "#874500"}

perms:
  user_read: {foreground: "#110e0b"}
  user_write: {foreground: "#874500"}
  user_execute_file: {foreground: "#005e1d"}
  user_execute_other: {foreground: "#005e1d"}
  group_read: {foreground: "#110e0b"}
  group_write: {foreground: "#874500"}
  group_execute: {foreground: "#005e1d"}
  other_read: {foreground: "#110e0b"}
  other_write: {foreground: "#874500"}
  other_execute: {foreground: "#005e1d"}
  special_user_file: {foreground: "#964072"}
  special_other: {foreground: "#5467ac"}
