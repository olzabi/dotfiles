  number_mega: {foreground: "#005871"}
  number_giga: {foreground: "#964072"}
  number_huge: {foreground: "#964072"}
  unit_byte: {foreground: "#110e0b"}
  unit_kilo: {foreground: "#005871"}
  unit_mega: {foreground: "#964072"}
  unit_giga: {foreground: "#964072"}
  unit_huge: {foreground: "#874500"}

users:
  user_you: {foreground: "#110e0b"}
  user_root: {foreground: "#a64542"}
  user_other: {foreground: "#964072"}
  group_yours: {foreground: "#110e0b"}
  group_other: {foreground: "#5467ac"}
  group_root: {foreground: "#a64542"}

links:
  normal: {foreground: "#714da0"}
