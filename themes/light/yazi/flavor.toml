#
# Palette (from darkvoid.nvim colors.lua):
#   bg               #d3ceca
#   fg               #3a3633
#   cursor           #006a6c  (bold accent)
#   visual           #bab6b1
#   comment          #77736f
#   line_nr          #a09b97
#   string           #2e2a27
#   func             #221e1b
#   kw               #120f0c
#   identifier       #433f3c
#   type             #4c4845
#   type_builtin     #373330
#   operator/glow    #006a6c  (bold accent)
#   search_highlight #006a6c
#   bracket          #1e1a17
#   bool             #006a6c
#   constant         #0f5d5f
#   preprocessor     #5c6b7b
#   eob              #a6a19d
#   border           #77736f
#   title            #006a6c
#   added            #00581b
#   changed          #4e4900
#   removed          #913948
#   error            #8e4742
#   warning          #2f5534
#   hint             #455b00
#   info             #326493

[mgr]
cwd = { fg = "#006a6c", bold = true }

find_keyword  = { fg = "#006a6c", bold = true, italic = true, underline = true }
find_position = { fg = "#006a6c", bold = true }

marker_copied   = { fg = "#00581b", bg = "#00581b" }
marker_cut      = { fg = "#913948", bg = "#913948" }
marker_marked   = { fg = "#4e4900", bg = "#4e4900" }
marker_selected = { fg = "#006a6c", bg = "#bab6b1", bold = true }

border_symbol = "│"
border_style  = { fg = "#77736f" }

[indicator]
current = { fg = "#120f0c", bg = "#bab6b1", bold = true }
preview = { fg = "#006a6c", bold = true, underline = true }

[tabs]
active   = { fg = "#006a6c", bg = "#bab6b1", bold = true }
inactive = { fg = "#77736f" }

[mode]
normal_main = { fg = "#006a6c", bg = "#bab6b1", bold = true }
normal_alt  = { fg = "#006a6c" }
select_main = { fg = "#006a6c", bg = "#bab6b1", bold = true }
select_alt  = { fg = "#006a6c" }
unset_main  = { fg = "#d3ceca", bg = "#913948", bold = true }
unset_alt   = { fg = "#913948" }

[status]
overall = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#3a3633", bold = true }
progress_normal = { fg = "#006a6c", bold = true }
progress_error  = { fg = "#8e4742" }

perm_type  = { fg = "#326493" }
perm_read  = { fg = "#0f5d5f" }
perm_write = { fg = "#4e4900" }
perm_exec  = { fg = "#006a6c", bold = true }
perm_sep   = { fg = "#a09b97" }

[input]
border   = { fg = "#77736f" }
title    = { fg = "#006a6c", bold = true }
value    = { fg = "#3a3633" }
selected = { fg = "#006a6c", bg = "#bab6b1", bold = true }

[pick]
border   = { fg = "#77736f" }
active   = { fg = "#006a6c", bold = true }
inactive = { fg = "#77736f" }

[tasks]
border  = { fg = "#77736f" }
title   = { fg = "#006a6c", bold = true }
hovered = { fg = "#006a6c", bold = true, underline = true }

[which]
mask            = { bg = "#d3ceca" }
cand            = { fg = "#006a6c", bold = true }
rest            = { fg = "#77736f" }
desc            = { fg = "#433f3c" }
separator       = "  "
separator_style = { fg = "#a09b97" }

[notify]
title_info  = { fg = "#326493", bold = true }
title_warn  = { fg = "#4e4900", bold = true }
title_error = { fg = "#8e4742", bold = true }

icon_info  = "󰋽"
icon_warn  = "󰀪"
icon_error = "󰅚"

[spot]
border = { fg = "#77736f" }
title  = { fg = "#006a6c", bold = true }

[cmp]
border   = { fg = "#77736f" }
active   = { fg = "#006a6c", bg = "#bab6b1", bold = true }
inactive = { fg = "#77736f" }

[help]
on      = { fg = "#006a6c", bold = true }
exec    = { fg = "#006a6c", bold = true }
desc    = { fg = "#77736f" }
hovered = { fg = "#120f0c", bg = "#bab6b1", bold = true }
footer  = { fg = "#006a6c", bg = "#bab6b1", bold = true }

# ── File type coloring (mime only in new Yazi API) ───────────────
[filetype]
rules = [
  { mime = "image/*",    fg = "#0f5d5f" },
  { mime = "video/*",    fg = "#373330" },
  { mime = "audio/*",    fg = "#006a6c" },

  { mime = "application/zip",              fg = "#8e4742" },
  { mime = "application/gzip",             fg = "#8e4742" },
  { mime = "application/x-tar",            fg = "#8e4742" },
  { mime = "application/x-bzip",           fg = "#8e4742" },
  { mime = "application/x-bzip2",          fg = "#8e4742" },
  { mime = "application/x-7z-compressed",  fg = "#8e4742" },
  { mime = "application/x-rar",            fg = "#8e4742" },
  { mime = "application/x-xz",             fg = "#8e4742" },
  { mime = "application/zstd",             fg = "#8e4742" },

  { mime = "application/pdf",              fg = "#326493" },
  { mime = "application/msword",           fg = "#326493" },
  { mime = "application/vnd.openxmlformats-officedocument.*", fg = "#326493" },
  { mime = "application/vnd.oasis.opendocument.*",            fg = "#326493" },

  { mime = "text/*", fg = "#2e2a27" },
  { mime = "*",      fg = "#4c4845" },
]

