# ╔══════════════════════════════════════════════════════════════╗
# ║              DARKVOID — Yazi Theme                          ║
# ║   Faithful port of darkvoid-theme/darkvoid.nvim             ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Palette (from darkvoid.nvim colors.lua):
#   bg               #1c1c1c
#   fg               #c0c0c0
#   cursor           #bdfe58  (lime accent)
#   visual           #303030
#   comment          #585858
#   line_nr          #404040
#   string           #d1d1d1
#   func             #e1e1e1
#   kw               #f1f1f1
#   identifier       #b1b1b1
#   type             #a1a1a1
#   type_builtin     #c5c5c5
#   operator/glow    #1bfd9c  (green accent)
#   search_highlight #1bfd9c
#   bracket          #e6e6e6
#   bool             #66b2b2
#   constant         #b2d8d8
#   preprocessor     #6a7a8a
#   eob              #3c3c3c
#   border           #585858
#   title            #bdfe58
#   added            #baffc9
#   changed          #ffffba
#   removed          #ffb3ba
#   error            #dea6a0
#   warning          #d6efd8
#   hint             #bedc74
#   info             #7fa1c3

[manager]
cwd = { fg = "#1bfd9c", bold = true }

hovered         = { fg = "#f1f1f1", bg = "#303030", bold = true }
preview_hovered = { fg = "#bdfe58", underline = true }

find_keyword  = { fg = "#bdfe58", bold = true, italic = true, underline = true }
find_position = { fg = "#1bfd9c", bold = true }

marker_copied   = { fg = "#baffc9", bg = "#baffc9" }
marker_cut      = { fg = "#ffb3ba", bg = "#ffb3ba" }
marker_marked   = { fg = "#ffffba", bg = "#ffffba" }
marker_selected = { fg = "#1bfd9c", bg = "#1bfd9c" }

tab_active   = { fg = "#bdfe58", bg = "#303030", bold = true }
tab_inactive = { fg = "#585858", bg = "#1c1c1c" }

border_symbol = "│"
border_style  = { fg = "#585858" }

syntect_theme = ""

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#303030", bg = "#303030" }

mode_normal = { fg = "#1c1c1c", bg = "#1bfd9c", bold = true }
mode_select = { fg = "#1c1c1c", bg = "#bdfe58", bold = true }
mode_unset  = { fg = "#1c1c1c", bg = "#ffb3ba", bold = true }

progress_label  = { fg = "#c0c0c0", bold = true }
progress_normal = { fg = "#1bfd9c", bg = "#1c1c1c" }
progress_error  = { fg = "#dea6a0", bg = "#1c1c1c" }

perm_type  = { fg = "#7fa1c3" }
perm_read  = { fg = "#b2d8d8" }
perm_write = { fg = "#ffffba" }
perm_exec  = { fg = "#1bfd9c" }
perm_sep   = { fg = "#404040" }

[input]
border   = { fg = "#585858" }
title    = { fg = "#bdfe58", bold = true }
value    = { fg = "#c0c0c0" }
selected = { fg = "#1c1c1c", bg = "#1bfd9c" }

[select]
border   = { fg = "#585858" }
active   = { fg = "#1bfd9c", bold = true }
inactive = { fg = "#585858" }

[tasks]
border  = { fg = "#585858" }
title   = { fg = "#bdfe58", bold = true }
hovered = { fg = "#1bfd9c", underline = true }

[which]
mask            = { bg = "#1c1c1c" }
cand            = { fg = "#1bfd9c", bold = true }
rest            = { fg = "#585858" }
desc            = { fg = "#b1b1b1" }
separator       = "  "
separator_style = { fg = "#404040" }

[notify]
title_info  = { fg = "#7fa1c3", bold = true }
title_warn  = { fg = "#ffffba", bold = true }
title_error = { fg = "#dea6a0", bold = true }

icon_info  = "󰋽"
icon_warn  = "󰀪"
icon_error = "󰅚"

[spot]
border = { fg = "#585858" }
title  = { fg = "#bdfe58", bold = true }

[completion]
border   = { fg = "#585858" }
active   = { fg = "#1bfd9c", bg = "#303030", bold = true }
inactive = { fg = "#585858" }

[help]
on      = { fg = "#bdfe58", bold = true }
exec    = { fg = "#1bfd9c" }
desc    = { fg = "#585858" }
hovered = { fg = "#f1f1f1", bg = "#303030", bold = true }
footer  = { fg = "#1c1c1c", bg = "#1bfd9c" }

# ── File type coloring (mime only in new Yazi API) ───────────────
[filetype]
rules = [
  { mime = "image/*",    fg = "#b2d8d8" },
  { mime = "video/*",    fg = "#c5c5c5" },
  { mime = "audio/*",    fg = "#66b2b2" },

  { mime = "application/zip",              fg = "#dea6a0" },
  { mime = "application/gzip",             fg = "#dea6a0" },
  { mime = "application/x-tar",            fg = "#dea6a0" },
  { mime = "application/x-bzip",           fg = "#dea6a0" },
  { mime = "application/x-bzip2",          fg = "#dea6a0" },
  { mime = "application/x-7z-compressed",  fg = "#dea6a0" },
  { mime = "application/x-rar",            fg = "#dea6a0" },
  { mime = "application/x-xz",             fg = "#dea6a0" },
  { mime = "application/zstd",             fg = "#dea6a0" },

  { mime = "application/pdf",              fg = "#7fa1c3" },
  { mime = "application/msword",           fg = "#7fa1c3" },
  { mime = "application/vnd.openxmlformats-officedocument.*", fg = "#7fa1c3" },
  { mime = "application/vnd.oasis.opendocument.*",            fg = "#7fa1c3" },

  { mime = "text/*", fg = "#d1d1d1" },
  { mime = "*",      fg = "#a1a1a1" },
]

