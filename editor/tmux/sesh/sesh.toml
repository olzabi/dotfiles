#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

dir_length = 2
blacklist = ["scratch"]
sort_order = [
  "config",
  "tmux",
  "zoxide"
]

[default_session]
tmuxinator = "default"

[[wildcard]]
pattern = "~/dev/*"
startup_command = "nvim"


[[session]]
name = "dotfiles"
path = "~/.config/dotfiles"
startup_command = "nvim"

