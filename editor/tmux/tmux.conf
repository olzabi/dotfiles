TMUX_PATH="$HOME/.config/tmux"
TMUX_PLUGIN_MANAGER_PATH="$TMUX_PATH/plugins"

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g update-environment -r

set -g default-terminal    "tmux-256color"
set -as terminal-features  ",xterm-256color:RGB"
set -as terminal-features  ",alacritty*:RGB"
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-features 'xterm-kitty:extkeys'

set -g extended-keys on
set -g extended-keys-format csi-u

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

unbind r
unbind R
unbind n
unbind '"'
unbind %

# ---
set -sg repeat-time 600
set -g detach-on-destroy off
set -g mode-keys vi
set -g status-keys vi
set -g status-interval 5

set -g mouse on
setw -g monitor-bell on
set -g monitor-activity on
set -g monitor-silence 15
set -g visual-activity off
set -g visual-silence off
set -g allow-passthrough on
set -g set-clipboard on
set -s focus-events on

# ---
set -g set-titles on
set -g pane-border-status bottom
set -g pane-border-format "[#P #{pane_title}]"
set -g pane-border-indicators arrows
set -g pane-border-status bottom
set -g display-panes-time 800

set -g base-index 1
setw -g pane-base-index 1
set -g automatic-rename-format '#{window_icon} #{b:pane_current_path}'
set -g renumber-windows on
setw -g automatic-rename on

# ---
bind j copy-mode
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind > swap-pane -D
bind < swap-pane -U
bind P choose-buffer
bind p paste-buffer -p
bind x kill-pane
bind X kill-window
bind b list-buffers

bind r source-file $TMUX_PATH/tmux.conf \; display "Config reloaded"
bind -n M-s run-shell "$TMUX_PATH/scripts/popup.sh subagents '#{session_name}' '#{pane_current_path}'"
bind -n M-f run-shell "$TMUX_PATH/scripts/popup.sh popup     '#{session_name}' '#{pane_current_path}'"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-h previous-window
bind -n M-l next-window
bind C-g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' $SHELL -lc 'lazygit'
bind C-h display-popup -E -w 90% -h 90% -d '#{pane_current_path}' $SHELL -lc 'hunk diff'
bind C-y split-window  -f -c "#{pane_current_path}" "yazi"
bind C-c new-session

bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection

bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

source "$HOME/.config/tmux/tmux.plugins.conf"

set -s escape-time 10
set -g display-time 1000
set -g history-limit 10000
set -g window-status-format         " #I #W#{?#{@pi_status}, #{@pi_status},} "
set -g window-status-current-format " #I #W#{?#{@pi_status}, #{@pi_status},} "

