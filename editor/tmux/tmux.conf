set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g history-limit 10000
set -g mouse on
set -g allow-passthrough on
set -g extended-keys on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
setw -g automatic-rename on
set -g automatic-rename-format '#{window_icon} #{b:pane_current_path}'
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
set -g monitor-activity on
set -g visual-activity off

bind BTab switch-client -l
unbind n
unbind p

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^f find' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)' \
    --preview 'sesh preview {}'
)\""

bind -n M-j send-keys M-j
bind -n M-k send-keys M-k

bind C-c new-session
bind C-g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' $SHELL -lc lazygit



set -g detach-on-destroy off
set -g mode-keys vi
bind j copy-mode

bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer
bind x kill-pane
bind X kill-window

bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %
bind > swap-pane -D
bind < swap-pane -U

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind Z confirm-before -p "Kill all dead panes?" \
    "run \"tmux list-panes -F '##{pane_id} ##{pane_dead}' \
        | awk '$2 == 1 { print $1 }' \
        | xargs -r -n1 tmux kill-pane -t\""

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

if -b '[ "$XDG_SESSION_TYPE" = "wayland" ] && command -v wl-copy > /dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | wl-copy"'
if -b 'command -v xsel > /dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | xsel -i -b"'
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
if -b 'command -v pbcopy > /dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | pbcopy"'

set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-floax'

set -g @themepack 'powerline/block/gray'

TMUX_FZF_OPTIONS="-p -w 62% -h 38% -m"
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_ORDER="session|window|pane|command|keybinding|clipboard|process"
TMUX_FZF_PANE_FORMAT="[#{window_name}] #{pane_current_command}  [#{pane_width}x#{pane_height}] [history #{history_size}/#{history_limit}, #{history_bytes} bytes] #{?pane_active,[active],[inactive]}"
TMUX_FZF_SWITCH_CURRENT=1

set -g @floax-bind '-n M-f'
set -g @floax-width '80%'
set -g @floax-height '80%'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

run '~/.config/tmux/plugins/tpm/tpm'
