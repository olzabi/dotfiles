onboarding = false

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true

[keys]
prefix = "ctrl+b"
reload_config            = "prefix+shift+r"
split_vertical           = "prefix+|"
split_horizontal         = "prefix+minus"
detach                   = "prefix+d"
open_notification_target = "prefix+o"

previous_tab = "prefix+p"
next_tab = "prefix+n"
new_tab = "ctrl+t"
previous_workspace = "prefix+k"
next_workspace = "prefix+j"
previous_agent = "alt+k"
next_agent     = "alt+j"
switch_tab     = "prefix+1..9"
rename_tab     = "prefix+,"

workspace_picker         = "prefix+w"
new_workspace            = "alt+w"
navigate_workspace_up    = "k"
navigate_workspace_down  = "j"
rename_workspace         = "prefix+$"

# worktrees: each one opens as its own workspace, so agents run in parallel without sharing a checkout.
# open_worktree is the main path: it opens worktrees made by `claude --worktree`/wt, which carry repo setup
# (sparse paths, node_modules links) that herdr's new_worktree does not.
new_worktree    = "prefix+shift+g"
open_worktree   = "prefix+shift+o"
remove_worktree = "prefix+shift+x"

# prefix+h: like herdr's focus_pane_left, but past the leftmost pane it focuses the herdr-side sidebar
# (bin/herdr-side nav); in the sidebar l / → / Esc return here.
focus_pane_left = ""

[[keys.command]]
key = "prefix+h"
type = "shell"
command = "herdr-side nav left"
description = "focus left pane or the sidebar"

[[keys.command]]
key = "prefix+ctrl+g"
type = "pane"
command = "lazygit"
description = "run lazygit"

[[keys.command]]
key = "alt+down"
type = "plugin_action"
command = "herdr-splits.nav-down"
[[keys.command]]
key = "alt+up"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "alt+ctrl+left"
type = "plugin_action"
command = "herdr-splits.resize-left"
[[keys.command]]
key = "alt+ctrl+down"
type = "plugin_action"
command = "herdr-splits.resize-down"
[[keys.command]]
key = "alt+ctrl+up"
type = "plugin_action"
command = "herdr-splits.resize-up"
[[keys.command]]
key = "alt+ctrl+right"
type = "plugin_action"
command = "herdr-splits.resize-right"

[ui]
agent_panel_sort = "spaces"
agent_panel_scope = "all"  # list agents from every workspace, incl. other worktrees
status_indicators = "symbols"
confirm_close                = true
mouse_capture                = true
redraw_on_focus_gained       = true
hide_tab_bar_when_single_tab = true
show_agent_labels_on_pane_borders = true
sidebar_collapsed_mode = "hidden"
pane_gaps              = false
pane_borders           = true
prompt_new_tab_name    = false

# agents: grouped by workspace (agent_panel_sort = "spaces"); the workspace name leads each row as the group label
#   project  status · branch            ($branch <- bin/herdr-vcs via agent hooks; worktree-aware)
# Merged alternative with collapsible workspaces + more sections: bin/herdr-side (niri Mod+A, Mod+Ctrl+A); then toggle this sidebar off.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    { token = "workspace", fg = "#83b7ad" },
    { token = "state_text", dim = true, rules = [
      { starts_with = "working", fg = "#ffffba", dim = false },
      { starts_with = "blocked", fg = "#dea6a0", dim = false, bold = true },
    ] },
    { token = "$branch", dim = true },
  ],
]

# spaces: one line per workspace; herdr lists a repo's worktree workspaces under it
#   ● project · branch · ↑1↓2
[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true },
    { token = "branch", dim = true },
    "git_status",
  ],
]

# Background notification popup delivery
# off | herdr | terminal | system
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]

# Play sounds when agents change state in background workspaces
[ui.sound]
[ui.sound.agents]
droid = "on"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
kitty_graphics = true
pane_history = true

[theme]
[theme.custom]
accent      = "#83b7ad"  # muted mint — primary highlight/active borders
panel_bg    = "#1c1c1c"  # bg
sidebar_bg  = "#1c1c1c"  # match the rest of the UI
active_row_bg = "#303030" # focused space or agent
selection_bg  = "#3c3c3c" # navigate-mode cursor
surface0    = "#3c3c3c"  # eob — selected/focused item background
surface1    = "#404040"  # line_nr — hover/active background (lightest surface tier)
surface_dim = "#303030"  # visual — dim separators
overlay0    = "#585858"  # comment — muted secondary text
overlay1    = "#a1a1a1"  # type — slightly brighter overlay text
text        = "#c0c0c0"  # fg — main text
subtext0    = "#b1b1b1"  # identifier — subdued text
mauve       = "#b2d8d8"  # muted special labels
green       = "#baffc9"  # done/idle agent state
yellow      = "#ffffba"  # changed/warning — working/running agent state
red         = "#dea6a0"  # error — blocked/needs-attention agent state
blue        = "#7fa1c3"  # info — unseen/done notification accent
teal        = "#66b2b2"  # bool — notification accent / unseen markers
peach       = "#bedc74"  # hint — interrupted/warning state

