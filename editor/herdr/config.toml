onboarding = false
[theme]
[theme.custom]
accent      = "#1bfd9c"  # mint — primary highlight/active borders (your "operator/accent mint")
panel_bg    = "#1c1c1c"  # bg
surface0    = "#3c3c3c"  # eob — selected/focused item background
surface1    = "#404040"  # line_nr — hover/active background (lightest surface tier)
surface_dim = "#303030"  # visual — dim separators
overlay0    = "#585858"  # comment — muted secondary text
overlay1    = "#a1a1a1"  # type — slightly brighter overlay text
text        = "#c0c0c0"  # fg — main text
subtext0    = "#b1b1b1"  # identifier — subdued text
mauve       = "#bdfe58"  # title/cursor lime — branch name / special label color
green       = "#1bfd9c"  # operator/mint — done/idle agent state
yellow      = "#ffffba"  # changed/warning — working/running agent state
red         = "#dea6a0"  # error — blocked/needs-attention agent state
blue        = "#7fa1c3"  # info — unseen/done notification accent
teal        = "#66b2b2"  # bool — notification accent / unseen markers
peach       = "#bedc74"  # hint — interrupted/warning state

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true

[keys]
prefix = "ctrl+b"
reload_config            = "prefix+shift+r"
split_vertical           = "prefix+|"
split_horizontal         = "prefix+minus"
detach                   = "prefix+d"
open_notification_target = "prefix+o"

focus_pane_left   = "alt+left"
focus_pane_down   = "alt+down"
focus_pane_up     = "alt+up"
focus_pane_right  = "alt+right"

previous_tab = "ctrl+h"
next_tab = "ctrl+l"
new_tab = "ctrl+t"
previous_workspace = "ctrl+k"
next_workspace = "ctrl+j"
previous_agent = "alt+j"
next_agent =  "alt+k"
switch_tab   = "prefix+1..9"
rename_tab   = "prefix+,"

workspace_picker         = "prefix+w"
new_workspace            = "alt+w"
navigate_workspace_up    = "k"
navigate_workspace_down  = "j"
rename_workspace         = "prefix+$"

[[keys.command]]
key = "prefix+ctrl+g"
type = "pane"
command = "lazygit"
description = "run lazygit"

[[keys.command]]
key = "alt+d"
type = "popup"
command = "hunk diff"
width = "90%"
height = "90%"

[[keys.command]]
key = "alt+s"
type = "popup"
command = "~/.config/herdr/herdr-picker.sh"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = '''herdr pane run "$(herdr tab create --cwd "${HERDR_ACTIVE_PANE_CWD:-$HOME}" --focus | jq -r '.result.root_pane.pane_id')" "omp"'''
description = "new tab"

[worktrees]
directory = "~/.config/herdr/worktrees"

[ui]
agent_panel_sort             = "priority"
confirm_close                = true
mouse_capture                = true
redraw_on_focus_gained       = true
hide_tab_bar_when_single_tab = true
show_agent_labels_on_pane_borders = true
sidebar_collapsed_mode = "hidden"
pane_gaps              = false
pane_borders           = true
prompt_new_tab_name    = false

# Background notification popup delivery
# off | herdr | terminal | system
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]

# Play sounds when agents change state in background workspaces
[ui.sound]
[ui.sound.agents]
droid = "on"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[advanced]
# scrollback_limit_bytes = 10000000
