onboarding = false

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true

[keys]
prefix = "ctrl+b"
reload_config            = "prefix+shift+r"
split_vertical           = "prefix+|"
split_horizontal         = "prefix+minus"
detach                   = "prefix+d"
open_notification_target = "prefix+o"

previous_tab = "prefix+p"
next_tab = "prefix+n"
new_tab = "ctrl+t"
previous_workspace = "prefix+k"
next_workspace = "prefix+j"
previous_agent = "alt+j"
next_agent     = "alt+k"
switch_tab     = "prefix+1..9"
rename_tab     = "prefix+,"

workspace_picker         = "prefix+w"
new_workspace            = "alt+w"
navigate_workspace_up    = "k"
navigate_workspace_down  = "j"
rename_workspace         = "prefix+$"

[[keys.command]]
key = "prefix+ctrl+g"
type = "pane"
command = "lazygit"
description = "run lazygit"

[[keys.command]]
key = "alt+down"
type = "plugin_action"
command = "herdr-splits.nav-down"
[[keys.command]]
key = "alt+up"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "alt+ctrl+left"
type = "plugin_action"
command = "herdr-splits.resize-left"
[[keys.command]]
key = "alt+ctrl+down"
type = "plugin_action"
command = "herdr-splits.resize-down"
[[keys.command]]
key = "alt+ctrl+up"
type = "plugin_action"
command = "herdr-splits.resize-up"
[[keys.command]]
key = "alt+ctrl+right"
type = "plugin_action"
command = "herdr-splits.resize-right"

[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"
confirm_close                = true
mouse_capture                = true
redraw_on_focus_gained       = true
hide_tab_bar_when_single_tab = true
show_agent_labels_on_pane_borders = true
sidebar_collapsed_mode = "hidden"
pane_gaps              = false
pane_borders           = true
prompt_new_tab_name    = false

[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true },
    { token = "$pr", fg = "#b2d8d8" },
  ],
  [ { token = "agent", fg = "#66b2b2" }, ],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [
    { token = "branch", dim = true },
    "git_status",
    { token = "$active_tab", dim = true },
  ],
]

[ui.sidebar.agents.rows_by_agent]
omp = [
  [
    "state_icon",
    { token = "workspace", bold = true },
    { token = "$pr", fg = "#b2d8d8" },
  ],
  [ { token = "terminal_title_stripped", fg = "#b1b1b1" }, ],
]

# Background notification popup delivery
# off | herdr | terminal | system
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]

# Play sounds when agents change state in background workspaces
[ui.sound]
[ui.sound.agents]
droid = "on"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
kitty_graphics = true
pane_history = false

[theme]
[theme.custom]
accent      = "#83b7ad"  # muted mint — primary highlight/active borders
panel_bg    = "#1c1c1c"  # bg
sidebar_bg  = "#1c1c1c"  # match the rest of the UI
active_row_bg = "#303030" # focused space or agent
selection_bg  = "#3c3c3c" # navigate-mode cursor
surface0    = "#3c3c3c"  # eob — selected/focused item background
surface1    = "#404040"  # line_nr — hover/active background (lightest surface tier)
surface_dim = "#303030"  # visual — dim separators
overlay0    = "#585858"  # comment — muted secondary text
overlay1    = "#a1a1a1"  # type — slightly brighter overlay text
text        = "#c0c0c0"  # fg — main text
subtext0    = "#b1b1b1"  # identifier — subdued text
mauve       = "#b2d8d8"  # muted special labels
green       = "#baffc9"  # done/idle agent state
yellow      = "#ffffba"  # changed/warning — working/running agent state
red         = "#dea6a0"  # error — blocked/needs-attention agent state
blue        = "#7fa1c3"  # info — unseen/done notification accent
teal        = "#66b2b2"  # bool — notification accent / unseen markers
peach       = "#bedc74"  # hint — interrupted/warning state

