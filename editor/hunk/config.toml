agent_notes = true
vcs = "git"
mode = "auto"
exclude_untracked = false
line_numbers = true
menu_bar = false
transparent_background = true
hunk_headers = false
theme = "custom"
wrap_lines = true
copy_decorations = false
cursor_line = "row"

[pager]
theme = "custom"

[custom_theme]
base = "github-dark-default"
label = "Darkvoid"

background = "#1c1c1c"
