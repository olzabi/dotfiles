agent_notes = true
vcs = "git"
mode = "auto"
exclude_untracked = false
line_numbers = true
menu_bar = true
transparent_background = true
hunk_headers = true
theme = "custom"

[pager]
theme = "custom"

[custom_theme]
base = "github-dark-default"
label = "Darkvoid"

background = "#1c1c1c"
panel = "#1c1c1c"
panelAlt = "#1c1c1c"
border = "#585858"
accent = "#1bfd9c"
accentMuted = "#66b2b2"
text = "#c0c0c0"
muted = "#585858"

addedBg = "#0d2010"
removedBg = "#2a1018"
movedAddedBg = "#252525"
movedRemovedBg = "#303030"
contextBg = "#1c1c1c"
addedContentBg = "#1a3a18"
removedContentBg = "#4a1020"
contextContentBg = "#1c1c1c"
addedSignColor = "#baffc9"
removedSignColor = "#ffb3ba"

lineNumberBg = "#1c1c1c"
lineNumberFg = "#404040"
selectedHunk = "#303030"
badgeAdded = "#baffc9"
badgeRemoved = "#ff8a95"
badgeNeutral = "#585858"
fileNew = "#baffc9"
fileDeleted = "#ff8a95"
fileRenamed = "#ffffba"
fileModified = "#b2d8d8"
fileUntracked = "#585858"
noteBorder = "#1bfd9c"
noteBackground = "#1c1c1c"
noteTitleBackground = "#303030"
noteTitleText = "#66b2b2"

[custom_theme.syntax]
