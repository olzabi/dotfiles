# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
# "$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
show_hidden = true
sort_by = "alphabetical"
linemode = "mtime"
sort_sensitive = true
sort_dir_first = true
ratio = [1, 2, 5]

[preview]
max_width  = 2000
max_height = 2000
ueberzug_scale = 1
ueberzug_offset = [0,0,0,0]
image_quality = 90
wrap = "no"
tab_size = 2

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 1073741824 # = 1024*1024*1024 = 1024MB
image_bound = [0, 0]
suppress_preload = false

[plugin]
prepend_fetchers = [
  { url = "*",  run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
prepend_previewers = [
  # { url = "*.md", run = 'piper -- glow --style "$HOME/.config/glow/darkvoid.glow.json" -w=$w  "$1"' },
  { url = "*.md", run = 'rich-darkvoid' },
  { mime = "text/*", run = "rich-darkvoid" },
  { mime = "application/json", run = "rich-darkvoid" },
  { mime = "application/*+json", run = "rich-darkvoid" },
  { mime = "application/{javascript,x-javascript,toml,yaml,x-yaml,x-ndjson}", run = "rich-darkvoid" },
  { mime = "{audio,video,image}/*", run = "mediainfo --no-metadata" },
]
prepend_preloaders = [
  { mime = "{audio,video,image}/*", run = "mediainfo" },
]

[opener]
edit = [
  { run = '$EDITOR %s',    block = true, desc = "$EDITOR", for = "linux" },
  { run = 'hunk diff %s1', block = true, desc = "Review diff in Hunk" },
]
edit_php = [
  { run = 'phpstorm64.exe %s',  desc = "Open in PhpStorm",  orphan = true, for = "unix" },
  { run = 'nvim %s',            desc = "Edit in Neovim",    block = true,  for = "unix" },
]
reveal = [
  { run = 'wslview %s1',                      orphan = true, desc = "Open in Windows (wslview)", for = "linux" },
  { run = 'explorer.exe "$(wslpath -w %s1)"', orphan = true, desc = "Reveal in Explorer", for = "linux" },
]
audio = [
  { run = '''mediainfo %s1; echo "Press enter to exit"; read''', block = true, desc = "Show media info" },
  { run = 'mpv --no-video %s', block = true },
]

[open]
prepend_rules = [
  { mime = "application/*zip",                               use = [ "extract", "reveal", ] },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [ "extract", "reveal", ] },
  { url = "*.blade.php",                                     use = "edit_php" },
  { url = "*.php",                                           use = "edit_php" },
  { mime = "audio/*",                                        use = "audio" },
  { mime = "text/*",                                         use = [ "edit",  "reveal"] },
  { mime = "*",                                              use = [ "edit",  "reveal"] },
]

[input]
cursor_blink = false

# cd
cd_title = "Change directory:"
cd_origin = "center"
cd_offset = [0, 2, 50, 3]

# create
create_title = ["Create:", "Create (dir):"]
create_origin = "center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# filter
filter_title = "Filter:"
filter_origin = "center"
filter_offset = [0, 2, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "center"
find_offset = [0, 2, 50, 3]

# search
search_title = "Search via {n}:"
search_origin = "center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "center"
shell_offset = [0, 2, 50, 3]

[log]
enabled = false
