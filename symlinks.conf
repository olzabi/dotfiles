# source:target — exceptions only. Automatic: config/<x> → ~/.config/<x>, home/<x> → ~/<x>.
# !<x> keeps config/<x> out of the automatic rule (linked below, or not linked at all).

!ai-usagebar
!firefox
!hush
!hyprwhspr
!idea
!lazysql
!obsidian
!vscode
!yay

$DOTFILES_AI:$HOME/.agents
$DOTFILES_AI/pi:$HOME/.pi
$DOTFILES_AI/claude:$HOME/.claude
$DOTFILES_AI/omp:$HOME/.omp
$DOTFILES_AI/mcp:$XDG_CONFIG_HOME/mcp

$DOTFILES_CONFIG/zsh/.zshrc:$HOME/.zshrc
$DOTFILES_CONFIG/zsh/.zshenv:$HOME/.zshenv

$DOTFILES_CONFIG/git/lazygit.config.yml:$XDG_CONFIG_HOME/lazygit/config.yml
$DOTFILES_CONFIG/git/jj/config.toml:$XDG_CONFIG_HOME/jj/config.toml
$DOTFILES_CONFIG/git/jj/conf.d:$XDG_CONFIG_HOME/jj/conf.d
$DOTFILES_CONFIG/lazysql/config.toml:$XDG_CONFIG_HOME/lazysql/config.toml
$DOTFILES_CONFIG/tmux/tmuxinator:$XDG_CONFIG_HOME/tmuxinator
$DOTFILES_CONFIG/tmux/sesh:$XDG_CONFIG_HOME/sesh
$DOTFILES_CONFIG/hyprwhspr/config.json:$XDG_CONFIG_HOME/hyprwhspr/config.json
$DOTFILES_CONFIG/ai-usagebar/colors.toml:$XDG_CONFIG_HOME/omarchy/current/theme/colors.toml

# systemd user units (enable with: systemctl --user enable --now <unit>)
$DOTFILES_CONFIG/hyprwhspr/hyprwhspr.service:$XDG_CONFIG_HOME/systemd/user/hyprwhspr.service
$DOTFILES_CONFIG/hush/hush-digest.service:$XDG_CONFIG_HOME/systemd/user/hush-digest.service
$DOTFILES_CONFIG/hush/hush-digest.timer:$XDG_CONFIG_HOME/systemd/user/hush-digest.timer
$DOTFILES_CONFIG/firefox/keypoints/keypoints.service:$XDG_CONFIG_HOME/systemd/user/keypoints.service
$DOTFILES_CONFIG/firefox/keypoints/keypoints-label.service:$XDG_CONFIG_HOME/systemd/user/keypoints-label.service
$DOTFILES_CONFIG/firefox/keypoints/keypoints-label.timer:$XDG_CONFIG_HOME/systemd/user/keypoints-label.timer

$DOTFILES_THEMES/darkvoid.gitconfig:$DOTFILES_CONFIG/git/darkvoid.gitconfig
$DOTFILES_THEMES/darkvoid.claude.json:$DOTFILES_AI/claude/themes/darkvoid.json
$DOTFILES_THEMES/darkvoid.pi.json:$DOTFILES_AI/pi/agent/themes/darkvoid.json
$DOTFILES_THEMES/darkvoid.omp.json:$DOTFILES_AI/omp/agent/themes/darkvoid.json
$DOTFILES_THEMES/darkvoid.glow.json:$DOTFILES_CONFIG/glow/darkvoid.json

# shortcut: fixed firefox profile id, look it up in profiles.ini once a second machine needs it
$DOTFILES_CONFIG/firefox/user.js:$XDG_CONFIG_HOME/mozilla/firefox/2c8j0ju3.default-release/user.js
$DOTFILES_CONFIG/firefox/chrome:$XDG_CONFIG_HOME/mozilla/firefox/2c8j0ju3.default-release/chrome

$DOTFILES/system/aconfmgr:$XDG_CONFIG_HOME/aconfmgr
