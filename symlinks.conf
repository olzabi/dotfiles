# source:target — exceptions only. Automatic: config/<x> → ~/.config/<x>, home/<x> → ~/<x>.
# !<x> keeps config/<x> out of the automatic rule (linked below, or not linked at all).

!ai-usagebar
!firefox
!hush
!hyprwhspr
!idea
!lazysql
!obsidian
!vscode
!yay
!ssh

$DOTFILES_AI:$HOME/.agents
$DOTFILES_AI/pi:$HOME/.pi
$DOTFILES_AI/claude:$HOME/.claude
$DOTFILES_AI/omp:$HOME/.omp
$DOTFILES_AI/mcp:$XDG_CONFIG_HOME/mcp

$DOTFILES_CONFIG/zsh/.zshrc:$HOME/.zshrc
$DOTFILES_CONFIG/zsh/.zshenv:$HOME/.zshenv
$DOTFILES_CONFIG/ssh/config:$HOME/.ssh/config

$DOTFILES_CONFIG/git/jj/config.toml:$XDG_CONFIG_HOME/jj/config.toml
$DOTFILES_CONFIG/git/jj/conf.d:$XDG_CONFIG_HOME/jj/conf.d
$DOTFILES_CONFIG/lazysql/config.toml:$XDG_CONFIG_HOME/lazysql/config.toml
$DOTFILES_CONFIG/tmux/tmuxinator:$XDG_CONFIG_HOME/tmuxinator
$DOTFILES_CONFIG/tmux/sesh:$XDG_CONFIG_HOME/sesh
$DOTFILES_CONFIG/hyprwhspr/config.json:$XDG_CONFIG_HOME/hyprwhspr/config.json

# systemd user units (enable with: systemctl --user enable --now <unit>)
$DOTFILES_CONFIG/hyprwhspr/hyprwhspr.service:$XDG_CONFIG_HOME/systemd/user/hyprwhspr.service
$DOTFILES_CONFIG/hush/hush-digest.service:$XDG_CONFIG_HOME/systemd/user/hush-digest.service
$DOTFILES_CONFIG/hush/hush-digest.timer:$XDG_CONFIG_HOME/systemd/user/hush-digest.timer
$DOTFILES_CONFIG/firefox/keypoints/keypoints.service:$XDG_CONFIG_HOME/systemd/user/keypoints.service
$DOTFILES_CONFIG/firefox/keypoints/keypoints-label.service:$XDG_CONFIG_HOME/systemd/user/keypoints-label.service
$DOTFILES_CONFIG/firefox/keypoints/keypoints-label.timer:$XDG_CONFIG_HOME/systemd/user/keypoints-label.timer

# darkvoid themes (themes/README.md): dark/ sources, light/ + auto/ generated by themes/build,
# current/ -> dark or light, set by bin/darkvoid-mode for apps that can't follow the system themselves.
# follow the system on their own:
$DOTFILES_THEMES/dark/kitty.conf:$DOTFILES_CONFIG/kitty/theme.conf
$DOTFILES_THEMES/dark/kitty.conf:$DOTFILES_CONFIG/kitty/dark-theme.auto.conf
$DOTFILES_THEMES/light/kitty.conf:$DOTFILES_CONFIG/kitty/light-theme.auto.conf
$DOTFILES_THEMES/light/nvim.lua:$DOTFILES_CONFIG/nvim/lua/darkvoid_light.lua
$DOTFILES_THEMES/dark/herdr-app.json:$DOTFILES_CONFIG/herdr-app/themes/darkvoid.json
$DOTFILES_THEMES/light/herdr-app.json:$DOTFILES_CONFIG/herdr-app/themes/darkvoid-light.json
$DOTFILES_THEMES/dark/pi.json:$DOTFILES_AI/pi/agent/themes/darkvoid.json
$DOTFILES_THEMES/light/pi.json:$DOTFILES_AI/pi/agent/themes/darkvoid-light.json
$DOTFILES_THEMES/dark/omp.json:$DOTFILES_AI/omp/agent/themes/darkvoid.json
$DOTFILES_THEMES/light/omp.json:$DOTFILES_AI/omp/agent/themes/darkvoid-light.json
$DOTFILES_THEMES/dark/claude.json:$DOTFILES_AI/claude/themes/darkvoid.json
$DOTFILES_THEMES/dark/idea.icls:$DOTFILES_CONFIG/idea/DarkVoid.icls
$DOTFILES_THEMES/light/idea.icls:$DOTFILES_CONFIG/idea/DarkVoidLight.icls
$DOTFILES_THEMES/dark/bat.tmTheme:$DOTFILES_CONFIG/bat/themes/darkvoid.tmTheme
$DOTFILES_THEMES/light/bat.tmTheme:$DOTFILES_CONFIG/bat/themes/darkvoid-light.tmTheme
# one file with both modes:
$DOTFILES_THEMES/auto/noctalia.json:$DOTFILES_CONFIG/noctalia/palettes/darkvoid.json
$DOTFILES_THEMES/auto/gtk.css:$DOTFILES_CONFIG/gtk-4.0/gtk.css
$DOTFILES_THEMES/auto/firefox-chrome.css:$DOTFILES_CONFIG/firefox/chrome/userChrome.css
$DOTFILES_THEMES/auto/firefox-content.css:$DOTFILES_CONFIG/firefox/chrome/userContent.css
$DOTFILES_THEMES/auto/obsidian.css:$DOTFILES_CONFIG/obsidian/themes/Darkvoid/theme.css
# through themes/current:
$DOTFILES_THEMES/current/niri.kdl:$DOTFILES_CONFIG/niri/theme.kdl
$DOTFILES_THEMES/current/bat.tmTheme:$DOTFILES_CONFIG/bat/themes/darkvoid-current.tmTheme
$DOTFILES_THEMES/current/delta.gitconfig:$DOTFILES_CONFIG/git/darkvoid.gitconfig
$DOTFILES_THEMES/current/yazi:$DOTFILES_CONFIG/yazi/flavors/darkvoid-current.yazi
$DOTFILES_THEMES/current/television.toml:$DOTFILES_CONFIG/television/themes/darkvoid-current.toml
$DOTFILES_THEMES/current/atuin.toml:$DOTFILES_CONFIG/atuin/themes/darkvoid-current.toml
$DOTFILES_THEMES/current/glow.json:$DOTFILES_CONFIG/glow/darkvoid-current.json
$DOTFILES_THEMES/current/rofi.rasi:$DOTFILES_CONFIG/rofi/darkvoid.rasi
$DOTFILES_THEMES/current/lazyjj.toml:$DOTFILES_CONFIG/git/jj/conf.d/zz-darkvoid.toml
$DOTFILES_THEMES/current/hunk.toml:$DOTFILES_CONFIG/hunk/config.toml
$DOTFILES_THEMES/current/lazygit.yml:$XDG_CONFIG_HOME/lazygit/config.yml
$DOTFILES_THEMES/current/ai-usagebar.toml:$XDG_CONFIG_HOME/omarchy/current/theme/colors.toml
$DOTFILES_THEMES/current/posting.yaml:$HOME/.local/share/posting/themes/darkvoid.yaml
# starship, eza and fzf-tab read themes/current through config/zsh (.zshenv, conf.d/20-completion.zsh)

# shortcut: fixed firefox profile id, look it up in profiles.ini once a second machine needs it
$DOTFILES_CONFIG/firefox/user.js:$XDG_CONFIG_HOME/mozilla/firefox/2c8j0ju3.default-release/user.js
$DOTFILES_CONFIG/firefox/chrome:$XDG_CONFIG_HOME/mozilla/firefox/2c8j0ju3.default-release/chrome

$DOTFILES/system/aconfmgr:$XDG_CONFIG_HOME/aconfmgr
