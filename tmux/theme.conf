# darkvoid palette
dv_bg="#0d0d0d"
dv_bg2="#1a1a1a"
dv_fg="#c0c0c0"
dv_dim="#555555"
dv_accent="#7a7a7a"
dv_glow="#d4d4d4"

set -g status-position bottom
set -g status-style "bg=$dv_bg,fg=$dv_fg"

set -g window-status-format         "#[fg=$dv_dim,bg=$dv_bg] #I #W "
set -g window-status-current-format "#[fg=$dv_glow,bg=$dv_bg2,bold] #I #W "
set -g window-status-separator      ""

set -g pane-border-style        "fg=$dv_bg2"
set -g pane-active-border-style "fg=$dv_accent"

set -g status-left  "#[fg=$dv_glow,bg=$dv_bg,bold] #S "
set -g status-right "#[fg=$dv_dim,bg=$dv_bg] %H:%M #[fg=$dv_accent]│#[fg=$dv_fg] #h "

set -g message-style "bg=$dv_bg2,fg=$dv_glow"
