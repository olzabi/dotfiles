# Project name pinned: the Makefile filters on it, and it was "dotfiles" when this lived at the repo root.
name: infra

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # localhost only: default credentials
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./storage/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dev}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - db_psql
    profiles: [postgres, sql, all]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DB:-devdb}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./storage/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - db_mysql
    profiles: [mysql, sql, all]
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: searxng
    restart: unless-stopped
    env_file:
      - ${SEARXNG_ENV_FILE:-./searxng/.env}
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:${SEARXNG_PORT:-8888}/
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    dns:
      - 1.1.1.1
      - 9.9.9.9
    volumes:
      - ./searxng/config:/etc/searxng:ro,Z
      - searxng_cache:/var/cache/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: [searxng, llm, all]
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    ports:
      - "127.0.0.1:9999:8080"
    restart: unless-stopped
    profiles: [monitor, all]
  grafana:
    image: docker.io/grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # anonymous Admin: never expose
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # used by provisioning files
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_DB: ${MYSQL_DB:-devdb}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./storage/grafana/provisioning:/etc/grafana/provisioning:Z
    networks:
      - db_psql
      - db_mysql
    profiles: [monitor, all]
# Explicit names keep the data created under the old "dotfiles" project.
volumes:
  dozzle_data:
    name: dotfiles_dozzle_data
  grafana-data:
    name: dotfiles_grafana-data
  postgres_data:
    name: dotfiles_postgres_data
  mysql_data:
    name: infra_mysql_data
  searxng_cache:
    name: dotfiles_searxng_cache
networks:
  db_psql:
    external: true
  db_mysql:
    external: true
