apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: postgres-dev
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1800
      maxOpenConns: 10
      maxIdleConns: 5
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
